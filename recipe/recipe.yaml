schema_version: 1

context:
  version: "0.13.2"

package:
  name: px-proxy
  version: ${{ version }}

source:
  url: https://github.com/genotrance/px/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 96ecc8926d81a66678c4e4f410583e7dcd2695d3a1b27411dfad9bef8cf4a12b
  patches:
    - libcurl-win-dll-path.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - px = px.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - keyring
    - libcurl
    - netaddr
    - psutil
    - pyspnego
    - python >=${{ python_min }}
    - python-dotenv
    - python-quickjs

tests:
  - python:
      imports:
        - px
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - px -h

about:
  homepage: https://github.com/genotrance/px
  repository: https://github.com/genotrance/px
  license: MIT
  license_file: LICENSE.txt
  summary: An HTTP proxy server to automatically authenticate through an NTLM proxy
  description: |
    Px is a HTTP(s) proxy server that allows applications to authenticate through
    an NTLM or Windows Kerberos authenticated proxy server, typically used in
    corporate deployments, without having to deal with the actual handshake. It is
    primarily designed to run on Windows systems and authenticates on behalf of the
    application using the currently logged in Windows user account.

extra:
  recipe-maintainers:
    - fcollonval
    - genotrance
    - m-rossi
